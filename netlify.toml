# Static site: no build step, publish the repo root.
[build]
  publish = "."

# Photos are cached for a year. Never overwrite a photo in place:
# give a changed photo a new filename so visitors get the new one.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Internal notes live in the repo root, which is the publish folder, so they would be public.
# Serve a 404 for them. (Netlify splats only work at the end of a path, so list each file.)
[[redirects]]
  from = "/VERSIONS.md"
  to = "/404"
  status = 404
  force = true
