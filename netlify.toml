# Static site: no build step, publish the repo root.
[build]
  publish = "."

# Photos are cached for a year. Never overwrite a photo in place:
# give a changed photo a new filename so visitors get the new one.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Internal notes live in the repo root, which is the publish folder, so they would be public.
# Serve a 404 for them. (Netlify splats only work at the end of a path, so list each file.)
[[redirects]]
  from = "/VERSIONS.md"
  to = "/404"
  status = 404
  force = true

# Renamed blog post (11/3/2026)
[[redirects]]
  from = "/blog/what-we-found-on-37000-contractor-websites.html"
  to = "/blog/what-contractor-websites-are-missing.html"
  status = 301

# Hallbridge Digital moved to one page at /digital/ (11/12/2026).
# force = true because the old files are still in the repo.
[[redirects]]
  from = "/digital-growth"
  to = "/digital/"
  status = 301
  force = true

[[redirects]]
  from = "/digital-growth/*"
  to = "/digital/"
  status = 301
  force = true
