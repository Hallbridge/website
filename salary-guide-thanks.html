<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Your 2026 Salary Guide | The Hallbridge Company</title>
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#15100C;color:#F9F6F1;font-family:'Inter',system-ui,sans-serif;padding:40px 20px}
  .wrap{max-width:560px;text-align:center}
  img.mono{width:56px;height:56px;margin-bottom:34px}
  p.eye{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#D39A5E}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:clamp(36px,6vw,52px);line-height:1.08;margin:16px 0 18px}
  h1 em{color:#D39A5E}
  p.b{color:rgba(242,236,226,.72);font-size:15px;line-height:1.7}
  a.btn{display:inline-block;margin-top:32px;background:#B87333;color:#fff;text-decoration:none;font-size:12px;letter-spacing:2px;text-transform:uppercase;padding:16px 28px}
  a.btn:hover{background:#A2622A}
  a.back{display:block;margin-top:26px;color:#B5A898;font-size:13px}
    h1, h2, h3 { text-wrap: balance; } p, li { text-wrap: pretty; }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="mono" src="assets/monogram-footer.svg" alt="The Hallbridge Company">
    <p class="eye">2026 Salary Guide</p>
    <h1>Thanks. Check your <em>inbox.</em></h1>
    <p class="b">We'll email your copy of the 2026 Salary Guide shortly. If you'd like a closer look at pay for a specific role or market, just reply to that email.</p>
    <a class="back" href="/">Back to hallbridge.co</a>
  </div>
</body>
</html>
